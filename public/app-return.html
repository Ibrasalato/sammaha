<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سمّها</title>
<style>body{margin:0;background:#F4F1EA;font-family:Tajawal,system-ui,sans-serif;color:#1B2A22;display:grid;place-items:center;min-height:100vh;text-align:center}a{display:inline-block;margin-top:16px;padding:12px 24px;border-radius:12px;background:#00513B;color:#fff;text-decoration:none;font-weight:700}</style>
</head><body><main>
<p id="m">جارٍ الرجوع إلى تطبيق سمّها…</p>
<a id="a" href="sammha://payment?state=pending">العودة إلى التطبيق</a>
</main>
<script>
  // the payment page lands here with ?payment=paid|pending|failed: hand it to the app (custom scheme sammha://)
  var s = new URLSearchParams(location.search).get('payment') || 'pending';
  var u = 'sammha://payment?state=' + encodeURIComponent(s);
  document.getElementById('a').href = u;
  location.replace(u);
</script></body></html>
